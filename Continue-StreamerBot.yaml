implementation:
  windows/StreamerBot.Native: Native WinUI main window, settings, global hotkeys, Windows audio, auxiliary
    windows and new PathSettingsDialog. No browser dashboard/Tkinter main UI.
  windows/StreamerBot.Native.Core: C# profile, AI HTTP, YouTube REST, stream controller, voice process
    protocol, ResourcePaths and VideoRenderer.
  windows/voice: Isolated original voice worker, 5 worker checks and 6 video/path checks.
  windows/installer: Explicit payload allowlist and per-user NSIS installer. .NET/Windows App SDK are
    self contained.
  resource-paths.json: 'Shared path-field catalog: 19 fields total, 17 visible in native app. Original-only
    LivePortrait fields and native-only runtime/cache fields are filtered appropriately.'
  resource_paths.py: Original control-panel dialog, validation and atomic path-only sidecar persistence.
    Unknown future fields retained.
  sadtalker_bridge.py: Selected project/venv Python, selected checkpoints/avatar/FFmpeg/output, CUDA tensor
    probe in actual selected environment, detailed renderer.log, unique per-job output, no stale MP4 fallback.
    Native C# owns renderer process tree and cancellation.
  original_compatibility_changes: Only controller.py, view.py, sadtalker_bridge.py, liveportrait_bridge.py
    and Toggle_Video_Rendering.bat were intentionally changed from frozen originals. No voice/hotkey implementation
    removed. 35 other original manifest files verified byte-identical.
  paths_contract_change: Voice output may be within app data OR the explicitly selected voice-cache folder.
    Arbitrary unselected locations remain rejected. Recordings remain inside app data.
  paths_persistence: Native paths are profile fields; relative imported paths resolve against .origin.
    Original paths are resource_paths.json next to original app and included in config export.
  toggle: Native installed BAT detects StreamerBot.Native.exe and toggles LOCALAPPDATA/StreamerBotNative/enable_video.txt.
    Original BAT uses app-folder enable_video.txt. Native Tools has same toggle.
  voice_preparation: Prepare-Voices.ps1 supports selected runtime root and existing 64-bit virtual-environment
    Python. System Python is rejected. Uses pinned CUDA stack and real tensor checks; no silent CPU replacement.
