restore:
  preferred: Clone the repository and obtain the saved commit/branch. Use the new task assigned branch
    for further changes. Extract the source backup only if repository recovery is unavailable.
  offline_source: StreamerBot-Native-Source.zip contains native code, worker, shared paths/video bridge,
    build/installer scripts and SOURCE-SHA256.json. Extract into writable folder.
  build_windows_requirements:
  - Windows 11 x64
  - .NET 10 x64 SDK
  - Python 3.11 x64 for build checks
  - NSIS 3.10
  build_command: powershell -NoProfile -ExecutionPolicy Bypass -File .\windows\Build-NativeInstaller.ps1
    -MakeNsis 'C:\Program Files (x86)\NSIS\makensis.exe'
  build_output: artifacts/native/StreamerBot-Native-Setup.exe
  workflow_note: Current push workflow matches the original assigned branch. Adapt it only to the next
    task authorized branch, following that task permissions.
  legacy_repair: Extract StreamerBot-ControlPanel-Paths-Video-Repair.zip separately, close original app,
    run Apply-Paths-Video-Repair.bat and select original folder. Makes backups, rejects customized/unrecognized
    versions before writes. Does not patch a packaged single-file Python EXE.
  legacy_archive: StreamerBot-Portable-AutoSetup.zip is the earlier original/Python compatibility package,
    retained for recovery. It is not the new C# native app. CUDA repair ZIP is also preserved.
  credentials: API keys, OAuth tokens, private profiles and model files are deliberately excluded. Transfer
    your own settings privately; YAML/source backups cannot authenticate another account.
  account_limits: This backup transfers project files and context, not account permissions, trial time,
    running services or access to a private GitHub repository.
